[project]
name = "watranscribe"
version = "0.1.0"
description = "WAtranscribe — WhatsApp voice note transcription & summarization (Flask)"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-wtf>=1.2",
    "flask-session>=0.8",
    "deepgram-sdk>=7.0",
    "anthropic>=0.40",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "gunicorn>=21.2",
    "werkzeug>=3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
