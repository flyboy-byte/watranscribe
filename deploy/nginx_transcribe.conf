# /etc/nginx/sites-available/transcribe.flyboybyte.com
#
# Matches this VPS's existing site convention (see disc.flyboybyte.com,
# budget.flyboybyte.com): minimal server block, shared security-headers
# snippet, shared `zone=login` rate-limit bucket (already defined once in
# /etc/nginx/nginx.conf and reused by every app's /login on this box).
#
# Start from this file, symlink into sites-enabled, then run
# `certbot --nginx -d transcribe.flyboybyte.com` — certbot rewrites this same
# block to add the 443/ssl_certificate lines and generates the separate
# port-80-redirect block itself. Don't hand-write the TLS lines.

server {
    server_name transcribe.flyboybyte.com;

    # Audio uploads can be tens of MB; keep in sync with
    # app.config.MAX_CONTENT_LENGTH (75MB) plus headroom. None of the other
    # sites on this box need this, so it's set here only.
    client_max_body_size 80m;

    location = /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:5759;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5759;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    include snippets/security-headers.conf;
}
